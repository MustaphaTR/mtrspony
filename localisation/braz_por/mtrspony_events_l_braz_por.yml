 ### Multi-Species Setup Events
 mtrspony_setup.1.name:0 "MustaphaTR's Pony Mod - Multi-Species Setup"
 mtrspony_setup.1.desc:0 "Hello there. MustaphaTR here.\n\nIt seems like you are using the portraits from my pony mod. Would you like to have variety of MLP species that the mod has portraits for on your planet?"
 mtrspony_setup.1.a:0 "No, keep using §Y[Root.GetSpeciesNamePlural]§! only."
 mtrspony_setup.1.b:0 "Spawn £pops£ §Y100§! each of other species."
 mtrspony_setup.1.c:0 "Adjust pop amount according to §YEquestria at War§! populations."
 mtrspony_setup.1.d:0 "Adjust pop amount, but keep §Y[Root.GetSpeciesNamePlural]§! as the most populous."
 mtrspony_setup.1.e:0 "Make each species start with equal pop amount."
 mtrspony_setup.3.name:0 "MustaphaTR's Pony Mod - Multi-Species Setup - AI"
 mtrspony_setup.3.desc:0 "Hello there. MustaphaTR here.\n\nIt seems like there are AI players in your game using the portraits from my pony mod called §Y[From.GetRealName]§!. Would you like them to have variety of MLP species that the mod has portraits for on their planet?"
 mtrspony_setup.3.a:0 "No, keep using §Y[From.GetSpeciesNamePlural]§! only."
 mtrspony_setup.3.d:0 "Adjust pop amount, but keep §Y[From.GetSpeciesNamePlural]§! as the most populous."

 ### Starting Leader Cutie Mark Setup Events
 mtrspony_setup.5.name:0 "MustaphaTR's Pony Mod - Starting Leader Cutie Mark"
 mtrspony_setup.5.desc:0 "Hello there. MustaphaTR here.\n\nIt seems like you are using the §UCutie Marks§! trait for your species. I wanted to make the trait this gives for the starting leader selectable by the player, but lack of checks for species traits prevents me from handing this in the empire creation screen. So instead, here's a setup event for it for you to select a trait from."
 mtrspony_setup.5.a:0 "Randomise"

 ### Gigastructural Engineering Compability Events
 gigacompat.2.name:0 "Faust Civilisations - Portraits"
 gigacompat.2.desc:0 "Hello there. MustaphaTR here.\n\nIt seems like you have both my pony portraits mod and Gigastructural Engineering enabled, and latter's Faustian Civilisations pre-FTL country seems to have appeared on this galaxy. Would you like them to use my mod's portraits, rather than the basegame ones that Gigastructural Engineering normally use?"
 gigacompat.2.a:0 "Yes, use the portraits from MustaphaTR's Pony Mod."
 gigacompat.2.b:0 "No, use the basegame portraits."

 ### Prescripted Country Special Events
 # Scootaloo's Cybernetics
 tcsstart.4.name:0 "The Path Already Chosen"
 tcsstart.4.desc:0 "While paving the path of our future with §MPsionics§!, we discovered they were incompatible with the §ECybernetic§! implants §Y[Root.GetName]§! and few others have been using for a long time. Removing the implants at this point is impossible for the most, as they owe their longevity to those implants. As such, a group of engineers led by §YLeopold Schmeller§!, who had initially developed the implants, had started working on improvements to the §ECybernetics§!. Their work has finally brought fruit, ensuring that the §ECyborg§! minority doesn't stay behind, but progress through the different path they had chosen."
 tcsstart.4.a:0 "Good work, everycreature."

 # Cozy Glow running the Penal Colony
 tcsstart.7.name:0 "$PRESCRIPTED_ruler_name_cozy_glow$"
 tcsstart.7.desc:1 "§HA familiar, yet not much wanted, face from our leader's foalhood, bearing a horn that she didn't have back in the day.§!\n\nHey, girls. Long time no see.\n\nI heard that you are setting up a planet as a Penal Colony, thought i could make myself useful there."
 tcsstart.7.a:0 "What are you up to now, Cozy?"
 tcsstart.7.a.response:0 "Come on! I've been on the clear for centuries. I've worked at several prisons since my ascension, this is only the logical continuation."
 tcsstart.7.b:0 "What have you been doing, anyway?"
 tcsstart.7.b.response:0 "What Flurry once did for me, helping ponies to the good side. Where else is better do that than a whole planet of bad guys?"
 tcsstart.7.c:0 "Why the Prison Colony?"
 tcsstart.7.c.response:0 "It is a good place to find people that need my help, but it is not just that. The prison system needs a reform to focus on rehabitation. I think i can achieve that there."
 tcsstart.7.hire_custom_tooltip:0 "§Y$PRESCRIPTED_ruler_name_cozy_glow$§! uniu-se ao nosso império como §HLíder§!."
