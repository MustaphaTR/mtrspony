 # United Faustian Hives
 EMPIRE_DESIGN_united_faustian_hives:0 "Объединенные Фаустские Ульи"
 EMPIRE_DESIGN_united_faustian_hives_desc:0 "The day of Princess Luna's return from her 1000-year banishment marks the turning point of the evolutionary history of Faustian species. A fear-fueled magical flare from one young filly by the name of Sweetie Belle led the creation of the first proto-Hivemind on the planet, consisting of 3 ponies. Despite their attempts to hide it, they quickly got the attention of both Twilight Sparkle and Princess Luna. But Princess Luna supported the group in hiding their ability and with her interference Twilight stopped looking into what made the trio's friendship tick. In the following years, the spell was recrated by Sweetie Belle and Princess Luna, allowing the expansion of the hive, using the Cutie Mark Camp as a front for it. Their numbers continued to grow in secret in the upcoming decades, with Princess Luna joining as well.\n\nTheir secrecy didn't last forever though. Conflict rose up between the hive and free-minded creatures from time to time, eventually leading to the hive considaliting its control over the whole planet. Nowadays there exists only one free-minded pony, Twilight Sparkle, who was barred from joining by the first "Hive Queen" due to initial friction between the two."
