 PRESCRIPTED_ruler_name_silverstream_eof_desc:0 "An eccentric princess of Aris, [Root.GetFirstName] is renowned for [Root.GetHisHer] unique perspective. It is that very unique perspective that has led to [Root.GetHisHer] ruling all of Zebrica."

