 PRESCRIPTED_ruler_name_sandbar:0 "Сэндбар"
 PRESCRIPTED_ruler_name_sandbar_desc:0 "An inoffensive but committed pony, [Root.GetFirstName] was been appointed to govern the Riverlands and has discovered a remarkable talent for oceanic habitation."
