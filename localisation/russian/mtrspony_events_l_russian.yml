 ### Multi-Species Setup Events
 mtrspony_setup.1.name:0 "MustaphaTR's Pony Mod - Multi-Species Setup"
 mtrspony_setup.10.desc:0 "Hello there. MustaphaTR here.\n\nIt seems like you or one of the AI empires are using the portraits from my pony mod. From this screen you can add other MLP species to start on the empire. There are a few preset options, but you can further adjust the numbers as you want.\n\nSetup needs to be done per planet. Currently doing the setup for §Y[From.GetName]§! in §Y[From.Owner.GetRealName]§!."
 mtrspony_setup.10.a:0 "§Y[MTRSPonyGetStartingSpeciesNamePlural]§!: [MTRSPonyGetStartingSpeciesPops]"
 mtrspony_setup.10.a_tt:0 "Adjust other species' numbers to change ones for your primary species."
