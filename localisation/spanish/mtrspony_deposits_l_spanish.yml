l_spanish:
 d_magical_jungles:0 "£blocker£ Junglas mágicas"
 d_magical_jungles_desc:0 "Heavily forested areas on Faust still escape much of exploitation due to their magical natures, worst example being the Everfree Forest."
 d_failing_infrastructure_faust:0 "$d_failing_infrastructure$"
 d_failing_infrastructure_faust_desc:0 "$d_failing_infrastructure_desc$"

 d_greater_vesalipolitian_metropolis:0 "Metrópolis de Gran Vesalipolis"
 d_greater_vesalipolitian_metropolis_desc:0 "Vesalipolis has grown quickly since the 11th century, overtaking Crystal City as the most populous city on the planet. But the fast growth brought its own problems. Thankfully, they are mostly solved by now."
 d_zebharan_solar_farms:0 "Parques solares zebharianos"
 d_zebharan_solar_farms_desc:0 "While the area around Neighle River has been expanded for agriculture, Central and Eastern Zebrica are still hot deserts fit for Solar Farms."
 d_thundarian_range:0 "Cordillera de Thundaria"
 d_thundarian_range_desc:0 "The Stormlands provide many different ways to generate energy with its weather, whether it be by lightning, wind or rain."
 d_griffking_dam:0 "Presa Griffking"
 d_griffking_dam_desc:0 "Damming the Griffking has caused major ruckus between the Riverponies and the Griffons, but in the end they agreed that neither side really needed Ost-Griffonia anyway."
 d_rock_farms:0 "Granjas de rocas"
 d_rock_farms_desc:0 "Equestrian Rock Farming tradition had to evolve to fit the times, but it has not died."
 d_andelayan_mines:0 "Minas de los Andelayas"
 d_andelayan_mines_desc:0 "The Andelayan Range is rich with many ores and precious stones."
 d_panthalassic_ore_veins:0 "Vetas minerales pantalásicas"
 d_panthalassic_ore_veins_desc:0 "While their exploitation has been limited until recently, many valuable minerals has been found at the floor of the vast Panthalassic Ocean."
 d_evi_valley_farmlands:0 "Tierra de labranza del valle de Evi"
 d_evi_valley_farmlands_desc:0 "Brodfeld has historically been the breadbasket of the Griffonian Empire, nowadays this tradition of agriculture has expanded into rest of the Evi Valley."
 d_seaquestrian_algae_farms:0 "Granjas de algas seacuestres"
 d_seaquestrian_algae_farms_desc:0 "While they are not fit for everycreature's taste, Algae make up the main agricultural product of the Seaponies."
 d_neighle_river_delta:0 "Delta del río Neighlo"
 d_neighle_river_delta_desc:0 "Much of Western Zebhara along the Neigle River has been terraformed in the late 11th century in order to expand the agricultural activity in the region."
 d_south_eastern_jungles:0 "Junglas del sureste"
 d_south_eastern_jungles_desc:0 "When they are not trying to kill you, jungles of south-eastern Equus and Zebrica proved to be quite productive."
 d_crystal_mountains:0 "Montañas de Cristal"
 d_crystal_mountains_desc:0 "There are several large deposits of Magical Crystals on Faust, mostly concentrated in Crystal and Diamond Mountains."

 d_failing_infrastructure_frost:0 "$d_failing_infrastructure$"
 d_failing_infrastructure_frost_desc:0 "$d_failing_infrastructure_desc$"
 d_geirfundsen_metropolitan_area:0 "Área metropolitana de Geirfundsen"
 d_geirfundsen_metropolitan_area_desc:0 "Destruction of Mathair Fearainn and Dachaigh in the nuclear war caused the rise of cities of Geirfuglvidda and Amundsen in their place, which since then merged into single entity. Their fast growth brought its own problems. Thankfully, they are mostly solved by now."
