 # Changeling Space Program
 EMPIRE_DESIGN_changeling_space_program:0 "CSP Remnants"
 EMPIRE_DESIGN_changeling_space_program_desc:0 "Two decades ago, when the Changeling Space Program finally reached the moon, Queen Chrysalis finally showed her true plan for the program. Using the power of the moon, she defeated the Equestrian Princesses, Celestia and Luna, in order to secure her own rule.\n\nBut in the end the move doomed the habitabilty of the planet by killing the pony responsible for its rotation. Stuck in tidal lock, Equus slowly lost its population while the remaning population under Chrysalis' iron hoof tried to find a solution to this problem.\n\nThere hasn't been a concrete solution to the problem as of yet, but with the rapid improvements in space travel, perhaps a new world can be found to live in."
 EMPIRE_DESIGN_changeling_space_program_federations:0 "CSP Remnants"
 EMPIRE_DESIGN_changeling_space_program_federations_desc:0 "Two decades ago, when the Changeling Space Program finally reached the moon, Queen Chrysalis finally showed her true plan for the program. Using the power of the moon, she defeated the Equestrian Princesses, Celestia and Luna, in order to secure her own rule.\n\nBut in the end the move doomed the habitabilty of the planet by killing the pony responsible for its rotation. Stuck in tidal lock, Equus slowly lost its population while the remaning population under Chrysalis' iron hoof tried to find a solution to this problem.\n\nThe solution came in the shape of orbital habitats. In the decades following Changeling Space Program managed to build several habitats in the orbits of different planets in the Solar System. Equus maybe lost forever, but the many races of the planet continue to survive in these habitats under Queen Chrysalis' rule."
