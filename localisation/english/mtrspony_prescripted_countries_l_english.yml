 # The Crusader State
 EMPIRE_DESIGN_the_crusader_state:0 "The Crusader State"
 EMPIRE_DESIGN_the_crusader_state_desc:0 "10 November 1007 is a very important date for the history of Faust. The start of the Arabian Civil War, which started the series of events that in the short span of 2 months brought down the central authorities across the planet. The result was years of war and warlordism with over a thousand factions fighting each other with hopes of gaining power.\n\nOf the many contenders, an unlikely one rose up as the eventual victor, the Cutie Mark Crusaders. Hailing from the small town of Ponyville in Equestria, the Crusaders were only 17 years old when the Great Collapse happened. Like many in Equestria at the time, they were unhappy with how Princess Celestia, who has been leading the country for over a millenium, handled the events leading to the collapse. With visions of a new leadership for Equestria they managed to gain some support in the small mining town of Foaltown nearby. Despite their initial lack of support, they managed to oust the Princess and reunite Equestria, then all of Faust. It took 13 years of constant warfare, but they did it.\n\nThat was 2 centruies ago though. Now Faust stands firmly united under the leadership of the Crusaders, who has since then found different methods of immortality for themselves, and ready to explore the stars.\n\n"Long live the Crusaders, Long live the State!""
 PRESCRIPTED_adjective_the_crusader_state:0 "Crusader"
 PRESCRIPTED_ruler_title_head_crusader:0 "Head Crusader"
 PRESCRIPTED_ship_prefix_the_crusader_state:0 "TCSSS"

