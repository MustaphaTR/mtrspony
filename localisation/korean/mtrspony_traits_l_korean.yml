l_korean:
 trait_cutie_marks:0 "Cutie Marks"
 trait_cutie_marks_tt:0 "Leaders start with additional §UCutie Mark§! traits."
 trait_cutie_marks_desc:0 "These creatures gain a mark that sets themselves apart from others when they find their talents."
 trait_equality_marks:0 "Equality Marks"
 trait_equality_marks_tt:0 "Leaders start with no traits."
 trait_equality_marks_desc:0 "These creatures are marked with symbols that make them equals with no individual talents."
 trait_pc_continental_secondary_ocean_preference:0 "Secondary Ocean Preference"
 trait_pc_continental_secondary_ocean_preference_desc:0 "These special fare as well in oceans as they do in their original habitats."

 triggered_cutie_mark_class_trait:0 "§UCutie Mark Trait§!\n[Root.GetClassTexticon] [Root.GetClass] 등급"

 leader_trait_cutie_mark_dusk_shine:0 "Cutie Mark (Dusk Shine)"
 leader_trait_cutie_mark_dusk_shine_desc:0 "$leader_trait_cutie_mark_twilight_sparkle_desc$"
 leader_trait_cutie_mark_apple_bloom:0 "Cutie Mark (Apple Bloom)"
 leader_trait_cutie_mark_apple_bloom_desc:0 "With a special talent towards farming and family life, this [Root.GetClass] encourages the growth of both people and plants. They are also talented towards finding other creatures' talents."
 leader_trait_cutie_mark_scootaloo:0 "Cutie Mark (Scootaloo)"
 leader_trait_cutie_mark_scootaloo_desc:0 "With a special talent towards speed and agilty, this [Root.GetClass] can bring out more speed out of the ships under their command, both to get their target faster and to avoid enemy fire. They are also talented towards finding other creatures' talents."
 leader_trait_cutie_mark_sweetie_belle:0 "Cutie Mark (Sweetie Belle)"
 leader_trait_cutie_mark_sweetie_belle_desc:0 "With a special talent towards singing, this [Root.GetClass] follows and on thier free time gets involved in the entertainment business. They are also talented towards finding other creatures' talents."
 leader_trait_cutie_mark_babs_seed:0 "Cutie Mark (Babs Seed)"
 leader_trait_cutie_mark_babs_seed_desc:0 "With a special talent towards undestanding of physical care, this [Root.GetClass] ensures that their entourage are always looking good on their jobs."
 leader_trait_cutie_mark_cozy_glow:0 "Cutie Mark (Cozy Glow)"
 leader_trait_cutie_mark_cozy_glow_desc:0 "With a special talent on strategy, this [Root.GetClass] can gain favorful conditions when negotiating diplomatic agreements."
 leader_trait_cutie_mark_sandbar:0 "Cutie Mark (Sandbar)"
 leader_trait_cutie_mark_sandbar_desc:0 "With a special talent focused on seas, oceans and beings living there, this [Root.GetClass] can make Ocean Worlds more livable places."
 leader_trait_cutie_mark_luna:0 "Cutie Mark (Luna)"
 leader_trait_cutie_mark_luna_desc:0 "With a special talent focused on the space, this [Root.GetClass] improves our awareness of the space around us."
 leader_trait_cutie_mark_twilight_sparkle:0 "Cutie Mark (Twilight Sparkle)"
 leader_trait_cutie_mark_twilight_sparkle_desc:0 "With a special talent focused on magic, this [Root.GetClass] revolutionizes the field of Physics, especially on Field Manuliplation."
 leader_trait_cutie_mark_mi_amore_cadenza:0 "Cutie Mark (Cadenza)"
 leader_trait_cutie_mark_mi_amore_cadenza_desc:0 "$leader_trait_cutie_mark_love_desc$"
 leader_trait_cutie_mark_flurry_heart:0 "Cutie Mark (Flurry Heart)"
 leader_trait_cutie_mark_flurry_heart_desc:0 "With a special talent of inspiring hope even in the worst of situations, this [Root.GetClass] improves the morale and defensive capabilities of their troops."
 leader_trait_cutie_mark_cherry_berry:0 "Cutie Mark (Cherry Berry)"
 leader_trait_cutie_mark_cherry_berry_desc:0 "With a love for Cherries born out of their special talent, this [Root.GetClass] consumes quite a lot of the fruit, but ensures that she has the supply available."

 leader_trait_cutie_mark_computing:0 "Cutie Mark (Computing)"
 leader_trait_cutie_mark_computing_desc:0 "With a special talent towards Computing, this [Root.GetClass] can more effectively make use of them in their jobs."
 leader_trait_cutie_mark_shields:0 "Cutie Mark (Shields)"
 leader_trait_cutie_mark_shields_desc:0 "With a special talent towards Shields, this [Root.GetClass] can improve ship and planetary shielding systems."
 leader_trait_cutie_mark_field_manupilation:0 "Cutie Mark (Field Manuliplation)"
 leader_trait_cutie_mark_field_manupilation_desc:0 "With a special talent towards Field Manuliplation, this [Root.GetClass] can revolutionize that field of Physics."
 leader_trait_cutie_mark_energy:0 "Cutie Mark (Energy)"
 leader_trait_cutie_mark_energy_desc:0 "With a special talent towards Energy Generation, this [Root.GetClass] can sequeeze out more output from our generators."
 leader_trait_cutie_mark_particles:0 "Cutie Mark (Particles)"
 leader_trait_cutie_mark_particles_desc:0 "With a special talent towards Particles, this [Root.GetClass] can more effectively make use of them in their jobs."

 leader_trait_cutie_mark_biology:0 "Cutie Mark (Biogoly)"
 leader_trait_cutie_mark_biology_desc:0 "With a special talent towards Biology, this [Root.GetClass] can more effectively make use of it in their jobs."
 leader_trait_cutie_mark_farming:0 "Cutie Mark (Agriculture)"
 leader_trait_cutie_mark_farming_desc:0 "With a special talent towards Agriculture, this [Root.GetClass] encourages the growth of not only planets and animals, but our people as well."
 leader_trait_cutie_mark_love:0 "Cutie Mark (Love)"
 leader_trait_cutie_mark_love_desc:0 "With a special talent focused on love, this [Root.GetClass] encourages the growth of our people."
 leader_trait_cutie_mark_military_theory:0 "Cutie Mark (Military Theory)"
 leader_trait_cutie_mark_military_theory_desc:0 "With a special talent towards Military Theory, this [Root.GetClass] can more effectively make use of it in their jobs."
 leader_trait_cutie_mark_new_worlds:0 "Cutie Mark (New Worlds)"
 leader_trait_cutie_mark_new_worlds_desc:0 "With a special talent towards New Worlds, this [Root.GetClass] encourages the growth of our colonies."
 leader_trait_cutie_mark_statecraft:0 "Cutie Mark (Statecraft)"
 leader_trait_cutie_mark_statecraft_desc:0 "With a special talent towards Statecraft, this [Root.GetClass] improves our diplomacy with other empires."
 leader_trait_cutie_mark_bureaucracy:0 "Cutie Mark (Bureaucracy)"
 leader_trait_cutie_mark_bureaucracy_desc:0 "With a special talent towards Bureaucracy, this [Root.GetClass] can increase the effectiveness of other Bureaucrats they work with."
 leader_trait_cutie_mark_bureaucracy_hive:0 "Cutie Mark (Synapse)"
 leader_trait_cutie_mark_archaeology:0 "Cutie Mark (Archaeology)"
 leader_trait_cutie_mark_archaeology_desc:0 "With a special talent towards Archaeology, this [Root.GetClass] can more effectively find and use ancient technology."

 leader_trait_cutie_mark_robotics:0 "Cutie Mark (Robotics)"
 leader_trait_cutie_mark_robotics_desc:0 "With a special talent towards Robotics, this [Root.GetClass] can allow us to more effectively produce Robots."
 leader_trait_cutie_mark_industry:0 "Cutie Mark (Industry)"
 leader_trait_cutie_mark_industry_desc:0 "With a special talent towards Industry, this [Root.GetClass] can revolutionize that field of Engineering."
 leader_trait_cutie_mark_mining:0 "Cutie Mark (Mining)"
 leader_trait_cutie_mark_mining_desc:0 "With a special talent towards Mining, this [Root.GetClass] can improve both extraction and distribituon of minerals on our planets."
 leader_trait_cutie_mark_materials:0 "Cutie Mark (Materials)"
 leader_trait_cutie_mark_materials_desc:0 "With a special talent towards Materials, this [Root.GetClass] can improve both extraction and distribituon of minerals on our planets."
 leader_trait_cutie_mark_crafts:0 "Cutie Mark (Crafts)"
 leader_trait_cutie_mark_crafts_desc:0 "With a special talent towards Crafts, this [Root.GetClass] can improve the efficiency of our [artisan.GetNamePlural]."
 leader_trait_cutie_mark_speed:0 "Cutie Mark (Speed)"
 leader_trait_cutie_mark_speed_desc:0 "With a special talent towards Speed, this [Root.GetClass] can move their fleets around the space faster than others."
 leader_trait_cutie_mark_propulsion:0 "Cutie Mark (Propulsion)"
 leader_trait_cutie_mark_propulsion_desc:0 "With a special talent towards Propulsion, this [Root.GetClass] can revolutionize that field of Engineering."
 leader_trait_cutie_mark_voidcraft:0 "Cutie Mark (Voidcraft)"
 leader_trait_cutie_mark_voidcraft_desc:0 "With a special talent towards Voidcraft, this [Root.GetClass] can improve the construction of our spacecraft."

 leader_trait_cutie_mark_art:0 "Cutie Mark (Entertainment)"
 leader_trait_cutie_mark_art_desc:0 "With a special talent towards Entertainment, this [Root.GetClass] follows and on thier free time gets involved in the business."
 leader_trait_cutie_mark_trade:0 "Cutie Mark (Trade)"
 leader_trait_cutie_mark_trade_desc:0 "With a special talent towards Trade, this [Root.GetClass] knows how to get the best of the deals."
 leader_trait_cutie_mark_trade_hive:0 "Cutie Mark (Logistics)"

